server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    add_header Vary "X-Inertia" always;
    add_header X-Debug-Inertia "$http_x_inertia" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        fastcgi_param HTTP_X_INERTIA $http_x_inertia;
        fastcgi_param HTTP_X_INERTIA_VERSION $http_x_inertia_version;
        fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_REFERER $http_referer;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
