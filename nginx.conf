server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # ✅ Critical: explicitly pass these headers through from PHP
        fastcgi_pass_header X-Inertia;
        fastcgi_pass_header X-Inertia-Location;
        fastcgi_pass_header Vary;

        # ✅ Don't let Nginx override Content-Type from PHP
        fastcgi_pass_header Content-Type;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}